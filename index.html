<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mooncake Moonlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0c1016;
      --bg-2: #1b2430;
      --panel: rgba(18, 23, 30, 0.72);
      --panel-strong: rgba(31, 40, 48, 0.96);
      --line: rgba(255,255,255,0.12);
      --ink: #f6eae8;
      --muted: #c8d0d8;
      --gold: #f2bf58;
      --red: #d75c48;
      --red-dark: #a93c31;
      --green: #6fa393;
      --blue: #82a9d3;
      --shadow: rgba(0,0,0,0.32);
    }

    * { box-sizing: border-box; }
    html {
      font-size: 18px;
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      font-size: 1.05rem;
      background:
        radial-gradient(circle at top, rgba(255, 200, 120, 0.14), transparent 20%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 42%, #0e1418 100%);
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 214, 173, 0.10), transparent 18%),
        radial-gradient(circle at 80% 14%, rgba(239, 156, 162, 0.12), transparent 25%),
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.10));
      mix-blend-mode: screen;
    }
    button { font: inherit; }
    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px clamp(20px, 5vw, 80px);
      border-bottom: 1px solid var(--line);
      background: rgba(10, 14, 19, 0.32);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 0.82rem;
    }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 50%; background: var(--red); box-shadow: 0 0 22px rgba(215, 92, 72, 0.45);
      font-family: "Playfair Display", serif; font-size: 1.1rem;
    }
    .brand .cn {
      color: var(--muted);
      font-weight: 500;
    }
    .top-actions {
      display: flex; gap: 10px; align-items: center;
      flex-wrap: wrap;
    }
    .action-btn, .primary-btn, .listen-btn { min-height: 48px; }
    .speech-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .action-btn, .primary-btn, .hero-card, .answer-btn {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .action-btn, .primary-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--ink);
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .action-btn:hover, .primary-btn:hover, .hero-card:hover, .answer-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(0,0,0,0.16), 0 0 18px rgba(242,191,88,0.12);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 22px 70px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 32px;
      align-items: end;
      padding: 42px 0 18px;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #f5c7ba;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.7rem;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(2.6rem, 5vw, 5rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    .zh-title {
      display: block;
      font-family: "Noto Serif SC", serif;
      color: #f0a18a;
      font-size: clamp(1.2rem, 2vw, 2rem);
      margin-top: 10px;
    }
    .intro-copy {
      max-width: 340px;
      margin: 0;
      color: rgba(246, 234, 232, 0.8);
      line-height: 1.7;
      font-size: 0.98rem;
    }

    body[data-reading="easy"] {
      --support-text: 1.08rem;
      font-family: Arial, "Noto Sans SC", sans-serif;
      letter-spacing: 0.01em;
    }

    body[data-reading="easy"] .scene .moon,
    body[data-reading="easy"] .cloud-drift,
    body[data-reading="easy"] .memory-glyph,
    body[data-reading="easy"] .river-current path,
    body[data-reading="easy"] .tower-beacon,
    body[data-reading="easy"] .scene-character,
    body[data-reading="easy"] .character-cape,
    body[data-reading="easy"] .fox-tail,
    body[data-reading="easy"] .level-art-icon,
    body[data-reading="easy"] .hero-card.selected {
      animation: none !important;
    }

    body[data-reading="easy"] .intro-copy,
    body[data-reading="easy"] .story-copy,
    body[data-reading="easy"] .story-copy-zh,
    body[data-reading="easy"] .summary-box,
    body[data-reading="easy"] .question-zh,
    body[data-reading="easy"] .answer-btn span {
      font-size: var(--support-text);
      line-height: 1.9;
    }

    body[data-reading="easy"] .question-title,
    body[data-reading="easy"] .story-title {
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    body[data-reading="easy"] .answer-btn {
      padding: 16px 18px;
      min-height: 112px;
    }

    body[data-reading="easy"] .answer-btn strong {
      font-size: 1.08rem;
      line-height: 1.5;
    }

    body[data-reading="easy"] .hero-card p,
    body[data-reading="easy"] .hero-card h2 {
      line-height: 1.45;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .scene {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      height: clamp(230px, 32vw, 410px);
      background: linear-gradient(180deg, #1b2430 0%, #2d3946 38%, #10161d 100%);
      box-shadow: 0 28px 54px rgba(0, 0, 0, 0.28);
    }
    .scene[data-scene="ruined"] {
      background: linear-gradient(180deg, #171e2b 0%, #2c2633 42%, #0f1117 100%);
    }
    .scene[data-scene="river"] {
      background: linear-gradient(180deg, #0e1d2a 0%, #17334a 40%, #0d1820 100%);
    }
    .scene[data-scene="river"] svg { filter: hue-rotate(28deg) saturate(1.18); }
    .scene[data-scene="tower"] {
      background: linear-gradient(180deg, #191a22 0%, #2a2332 36%, #0d0f18 100%);
    }
    .scene[data-scene="tower"] svg { filter: hue-rotate(325deg) brightness(.82) contrast(1.08); }
    .scene svg {
      display: block; width: 100%; height: 100%;
    }
    .scene .moon {
      transform-origin: 938px 92px;
      animation: moon-glow 5s ease-in-out infinite alternate;
    }
    .scene.arriving { animation: scene-arrive 0.8s ease-out; }
    .scene.responding { animation: scene-response 0.65s ease-out; }
    .cloud-drift { animation: cloud-drift 22s linear infinite alternate; }
    .cloud-drift.second { animation-duration: 30s; animation-direction: alternate-reverse; }
    .memory-glyph { transform-box: fill-box; animation: glyph-drift 6s ease-in-out infinite; }
    .memory-glyph.second { animation-delay: -2s; animation-duration: 7s; }
    .memory-glyph.third { animation-delay: -4s; animation-duration: 5s; }
    .river-current { opacity: 0; transition: opacity 0.6s ease; }
    .scene[data-scene="river"] .river-current { opacity: 1; }
    .river-current path { animation: river-flow 5s linear infinite; }
    .tower-structure { opacity: 0; transition: opacity 0.7s ease; }
    .scene[data-scene="tower"] .tower-structure { opacity: 1; }
    .tower-beacon { opacity: 0; transform-box: fill-box; transform-origin: bottom center; }
    .scene[data-scene="tower"] .tower-beacon { animation: beacon-pulse 2.2s ease-in-out infinite; }
    .scene[data-scene="ruined"] .scene-character.hero { animation-duration: 1.8s; }
    .scene[data-scene="river"] .scene-character.fox { animation-duration: 2s; }
    .scene[data-scene="tower"] .scene-character.hero { animation-duration: 1.2s; }
    .scene[data-scene="tower"] .scene-spark { animation-duration: 1.4s; }
    .scene-character {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: character-bob 2.8s ease-in-out infinite;
    }
    .scene-character.fox { animation-delay: -0.8s; }
    .scene-character.child { animation-delay: -1.4s; }
    .character-cape { transform-origin: 50% 0; animation: cape-sway 2.4s ease-in-out infinite alternate; }
    .fox-tail { transform-origin: 100% 75%; animation: tail-wag 0.8s ease-in-out infinite alternate; }
    .scene-spark { animation: spark 2.6s ease-in-out infinite; }
    @keyframes moon-glow {
      from { opacity: 0.72; }
      to { opacity: 1; }
    }
    @keyframes character-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes cape-sway {
      from { transform: rotate(-3deg); }
      to { transform: rotate(4deg); }
    }
    @keyframes tail-wag {
      from { transform: rotate(-12deg); }
      to { transform: rotate(12deg); }
    }
    @keyframes spark {
      0%, 100% { opacity: 0.2; transform: translateY(3px); }
      50% { opacity: 1; transform: translateY(-5px); }
    }
    @keyframes cloud-drift {
      from { transform: translateX(-18px); }
      to { transform: translateX(34px); }
    }
    @keyframes glyph-drift {
      0%, 100% { opacity: 0.28; transform: translateY(6px) rotate(-5deg); }
      50% { opacity: 0.9; transform: translateY(-10px) rotate(5deg); }
    }
    @keyframes river-flow {
      to { stroke-dashoffset: -80; }
    }
    @keyframes beacon-pulse {
      0%, 100% { opacity: 0.25; transform: scaleY(0.88); }
      50% { opacity: 0.9; transform: scaleY(1.08); }
    }
    @keyframes scene-arrive {
      0% { filter: brightness(0.72); }
      45% { filter: brightness(1.22); }
      100% { filter: brightness(1); }
    }
    @keyframes scene-response {
      0%, 100% { filter: brightness(1); box-shadow: 0 28px 54px rgba(0,0,0,0.28); }
      45% { filter: brightness(1.22); box-shadow: 0 0 36px rgba(242,191,88,0.28); }
    }
    @keyframes panel-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes faint-glow {
      0%, 100% { box-shadow: 0 0 0 rgba(242,191,88,0); }
      50% { box-shadow: 0 0 22px rgba(242,191,88,0.14); }
    }
    @keyframes choice-enter {
      from { opacity: 0; transform: translateY(18px) translateZ(-12px) rotateX(8deg); }
      to { opacity: 1; transform: translateY(0) translateZ(8px) rotateX(1deg); }
    }
    @keyframes level-enter {
      from { opacity: 0; transform: translateY(14px) translateZ(-12px) rotateX(8deg) scale(.98); }
      to { opacity: 1; transform: translateY(0) translateZ(8px) rotateX(1deg) scale(1); }
    }
    .answer-btn { animation: choice-enter 0.55s both; animation-delay: var(--entry-delay, 0ms); }
    .hero-card { animation: choice-enter 0.55s both; animation-delay: var(--entry-delay, 0ms); }
    .level-card { animation: level-enter 0.6s both; animation-delay: var(--entry-delay, 0ms); }
    .hero-card.selected { animation-name: choice-enter, selected-glow; animation-duration: 0.55s, 2s; animation-iteration-count: 1, infinite; }
    @keyframes selected-glow {
      0%, 100% { box-shadow: 0 0 0 rgba(242,191,88,0); }
      50% { box-shadow: 0 0 18px rgba(242,191,88,0.18); }
    }
    .scene[data-scene="river"] .scene-character { animation-duration: 3.5s; }
    .scene[data-scene="tower"] .character-cape { animation-duration: 1.3s; }
    body[data-mode="story"] .scene {
      height: clamp(450px, 67vh, 760px);
      border-radius: 22px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.42), 0 0 50px rgba(170,190,224,0.09);
      perspective: 1200px;
      perspective-origin: 50% 42%;
      transform-style: preserve-3d;
      isolation: isolate;
    }
    body[data-mode="story"] .hero { display: none; }
    body[data-mode="story"] .scene::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: -12%;
      pointer-events: none;
      opacity: .8;
      transform: translateZ(-180px) scale(1.28);
      background:
        radial-gradient(ellipse at 50% 100%, rgba(107,177,190,.2), transparent 38%),
        radial-gradient(ellipse at 18% 25%, rgba(118,140,188,.18), transparent 32%),
        linear-gradient(180deg, rgba(10,16,27,.05), rgba(7,11,18,.72));
    }
    body[data-mode="story"] .scene > svg {
      display: none;
    }
    .city-world {
      position: absolute;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      perspective: 1050px;
      transform-style: preserve-3d;
      background: linear-gradient(180deg, #121c30 0%, #293146 55%, #141821 100%);
    }
    .city-world[data-city="river"] {
      background: linear-gradient(180deg, #0d2539 0%, #255169 53%, #101a28 100%);
    }
    .city-world[data-city="tower"] {
      background: linear-gradient(180deg, #111526 0%, #34263d 54%, #11141e 100%);
    }
    .city-sky {
      position: absolute;
      inset: 0;
      transform: translateZ(-260px) scale(1.4);
      background:
        radial-gradient(circle at 75% 20%, rgba(255,235,194,.9) 0 18px, rgba(255,235,194,.18) 19px 36px, transparent 38px),
        radial-gradient(ellipse at 50% 90%, rgba(95,164,188,.18), transparent 56%);
    }
    .city-sky::before,
    .city-sky::after {
      content: "";
      position: absolute;
      inset: 12% 5%;
      background-image: radial-gradient(circle, rgba(255,255,255,.82) 0 1px, transparent 1.8px);
      background-size: 87px 71px;
      opacity: .46;
    }
    .city-sky::after { inset: 5% 22%; background-size: 121px 93px; opacity: .26; }
    .city-water {
      position: absolute;
      z-index: 1;
      left: -12%;
      bottom: 8%;
      width: 124%;
      height: 30%;
      opacity: 0;
      transform: rotateX(69deg) translateZ(-35px);
      transform-origin: center bottom;
      background: repeating-linear-gradient(175deg, rgba(153,231,236,.42) 0 2px, transparent 2px 24px), linear-gradient(180deg, #35778a, #101c30);
      box-shadow: 0 -18px 50px rgba(95,213,225,.28);
      transition: opacity .6s ease;
    }
    .city-world[data-city="river"] .city-water { opacity: .9; }
    .city-ground {
      position: absolute;
      z-index: 2;
      left: -15%;
      bottom: -36%;
      width: 130%;
      height: 64%;
      transform: rotateX(73deg) translateZ(18px);
      transform-origin: center top;
      background:
        linear-gradient(90deg, transparent 49.7%, rgba(238,205,151,.74) 50% 50.4%, transparent 50.7%),
        repeating-linear-gradient(0deg, transparent 0 62px, rgba(255,255,255,.08) 63px 65px),
        linear-gradient(180deg, #46515b, #151921 76%);
      border-top: 2px solid rgba(202,222,227,.38);
      box-shadow: 0 -20px 70px rgba(0,0,0,.38);
    }
    .city-ground::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 8px;
      height: 100%;
      transform: translateX(-50%);
      background: repeating-linear-gradient(180deg, #f8d88c 0 28px, transparent 29px 54px);
      opacity: .7;
    }
    .city-building {
      position: absolute;
      z-index: 2;
      left: var(--x);
      bottom: 17%;
      width: clamp(72px, 10vw, 150px);
      height: var(--height);
      transform: translateZ(var(--z)) rotateY(var(--turn, -8deg));
      transform-style: preserve-3d;
      transform-origin: center bottom;
      filter: drop-shadow(18px 16px 14px rgba(0,0,0,.36));
    }
    .city-face {
      position: absolute;
      backface-visibility: hidden;
      border: 1px solid rgba(199,226,240,.12);
    }
    .city-face.front {
      inset: 0;
      transform: translateZ(clamp(18px, 2vw, 28px));
      background:
        repeating-linear-gradient(90deg, transparent 0 17px, rgba(242,211,154,.5) 18px 21px, transparent 22px 30px),
        repeating-linear-gradient(0deg, transparent 0 22px, rgba(220,233,238,.18) 23px 25px, transparent 26px 35px),
        linear-gradient(90deg, #263341, #475462 48%, #202b39);
      box-shadow: inset 8px 0 rgba(5,11,20,.24), inset -8px 0 rgba(8,13,22,.3);
    }
    .city-face.side {
      top: 0;
      left: 50%;
      width: clamp(28px, 4vw, 58px);
      height: 100%;
      transform: translateX(-50%) rotateY(90deg) translateZ(clamp(36px, 5vw, 74px));
      background:
        repeating-linear-gradient(0deg, transparent 0 22px, rgba(220,233,238,.12) 23px 25px, transparent 26px 35px),
        linear-gradient(90deg, #101a29, #263342);
    }
    .city-face.roof {
      top: 0;
      left: 0;
      width: 100%;
      height: clamp(28px, 4vw, 58px);
      transform: translateY(-50%) rotateX(90deg) translateZ(var(--roof-depth, 26px));
      background: linear-gradient(135deg, #64717c, #293847 72%);
      box-shadow: inset 0 0 15px rgba(0,0,0,.4);
    }
    .city-building[data-shape="ruined"] .front {
      clip-path: polygon(0 0, 29% 0, 35% 8%, 62% 8%, 69% 0, 100% 0, 100% 100%, 0 100%);
    }
    .city-world[data-city="river"] .city-building .front {
      background:
        repeating-linear-gradient(90deg, transparent 0 17px, rgba(121,225,230,.58) 18px 21px, transparent 22px 30px),
        repeating-linear-gradient(0deg, transparent 0 22px, rgba(220,233,238,.2) 23px 25px, transparent 26px 35px),
        linear-gradient(90deg, #183448, #386071 48%, #193148);
    }
    .city-world[data-city="tower"] .city-building .front {
      background:
        repeating-linear-gradient(90deg, transparent 0 17px, rgba(248,192,126,.54) 18px 21px, transparent 22px 30px),
        repeating-linear-gradient(0deg, transparent 0 22px, rgba(230,216,243,.18) 23px 25px, transparent 26px 35px),
        linear-gradient(90deg, #352c42, #625064 48%, #29263a);
    }
    .city-building[data-landmark="tower"] {
      z-index: 3;
      left: 45%;
      width: clamp(88px, 13vw, 185px);
      height: clamp(280px, 55vh, 520px);
      transform: translateZ(72px) rotateY(-10deg);
    }
    .city-building[data-landmark="tower"] .front {
      clip-path: polygon(10% 12%, 30% 0, 70% 0, 90% 12%, 100% 100%, 0 100%);
      border-top: 4px solid rgba(255,218,156,.65);
      box-shadow: inset 0 0 25px rgba(255,174,108,.2), 0 0 40px rgba(229,161,122,.24);
    }
    .city-building[data-landmark="tower"] .roof {
      background: linear-gradient(135deg, #f1cd91, #6b5260 70%);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }
    .city-cityscape {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: city-camera-drift 22s ease-in-out infinite alternate;
    }
    @keyframes city-camera-drift {
      from { transform: rotateY(-1deg) rotateX(1deg) translateX(-.4%); }
      to { transform: rotateY(1deg) rotateX(-.5deg) translateX(.4%); }
    }
    body[data-mode="story"] .scene::after {
      z-index: 3;
      transform: translateZ(125px) scale(1.015);
      mix-blend-mode: screen;
    }
    .vn-sprite {
      position: absolute;
      z-index: 2;
      bottom: 0;
      left: clamp(18px, 12vw, 170px);
      width: clamp(190px, 28vw, 340px);
      height: 88%;
      transform-origin: center bottom;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.34));
      transform-style: preserve-3d;
      animation: sprite-arrive 0.55s cubic-bezier(.2,.8,.2,1) both;
    }
    .vn-sprite.talking {
      animation: sprite-arrive .55s cubic-bezier(.2,.8,.2,1) both, sprite-talk 1.8s ease-in-out infinite, city-walk 18s ease-in-out infinite;
    }
    .vn-model {
      width: 100%;
      height: 100%;
      transform: translateZ(96px) rotateY(-7deg) rotateX(2deg);
      transform-style: preserve-3d;
      filter: drop-shadow(14px 0 12px rgba(0,0,0,.2));
      animation: model-turn 8s ease-in-out infinite alternate;
    }
    .vn-sprite svg { width: 100%; height: 100%; overflow: visible; }
    .vn-sprite .sprite-hair { fill: url(#hair-shade); }
    .vn-sprite .sprite-highlight { fill: url(#teal-highlight); }
    .vn-sprite .sprite-coat { fill: url(#coat-shade); }
    .vn-sprite .sprite-accent { fill: url(#skin-shade); }
    .vn-sprite .sprite-eye { fill: #20232c; transform-box: fill-box; transform-origin: center; }
    .vn-sprite .sprite-mouth { display: none; fill: none; stroke: #8d4652; stroke-width: 4; stroke-linecap: round; }
    .vn-sprite[data-pose="thinking"] { --sprite-tilt: -2deg; }
    .vn-sprite[data-pose="reassuring"] { --sprite-tilt: 2deg; }
    .vn-sprite[data-expression="concerned"] .mouth-concerned,
    .vn-sprite[data-expression="happy"] .mouth-happy,
    .vn-sprite[data-expression="surprised"] .mouth-surprised,

      font-family: "Playfair Display", serif; font-size: 1.6rem;
    }

    .chapter-list {
      list-style: none; margin: 0; padding: 0;
    }
    .chapter-list li {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; color: rgba(255,255,255,0.7); font-size: 0.83rem;
    }
    .chapter-dot {
      width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,0.22); font-size: 0.7rem;
      flex-shrink: 0;
    }
    .chapter-list li.active { color: var(--ink); font-weight: 700; }
    .chapter-list li.active .chapter-dot { background: var(--green); border-color: var(--green); }
    .chapter-list li.done .chapter-dot { background: var(--red); border-color: var(--red); }

    .progress-wrap { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 18px; }
    .progress-copy {
      display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 0.72rem; margin-bottom: 8px;
    }
    .progress-track {
      height: 6px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.08);
    }
    .progress-fill {
      height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--gold));
      transition: width 0.25s ease;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .hero { display: block; }
      .intro-copy { margin-top: 12px; max-width: 100%; }
      .game-shell { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .hero-grid { grid-template-columns: 1fr; }
      .catalog-grid { grid-template-columns: 1fr; }
      .process-steps { grid-template-columns: 1fr; }
      .side-panel { order: -1; }
    }
  </style>
</head>

          curious: ["The Hidden Lab", "隐藏实验室", "You reached the ruined lab and found the broken language engine. It was not just deleting letters — it was stealing entire sets of characters from the world so people could not speak, write, or remember. A key from the archive pointed toward a deeper truth beneath the river.", "你来到被破坏的实验室，发现了损坏的语言引擎。它不只是删除字母，而是在窃取整套字符，让人类无法说话、写字、记忆。档案中的钥匙指向了河下更深的真相。"],
          brave: ["The Blank Sky", "空白天空", "You forced your way into the tower and saw the damage for the first time. Signs, books, and bridges were collapsing into empty voids. Chinese characters and English letters were disappearing together, and even the sky felt like it was losing its memory.", "你强行闯入高塔，第一次看清了灾难的规模。路牌、书本和桥梁都在坠入空白。中文字符与英文字母同时消失，连天空都像在失去记忆。"]

        story: {
          kind: ["The Names Return", "名字回来了", "You opened the shelter, cared for the children who had lost their names, and led everyone to speak their own stories aloud. Chinese characters and English letters returned in the sound of their voices. The city began to understand that language was not a tool for power — it was the living memory of people.", "你打开了避难所，照顾失去名字的孩子，并带领大家大声说出自己的故事。中文字符和英文字母在声音中回来了。城市开始明白：语言不是权力的工具，而是人类活着的记忆。"],

          {

    function speakBilingual(englishText, mandarinText, cantoneseText = mandarinText) {
      const labels = ui[state.language];
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        speechStatus.textContent = labels.speechUnavailable;
        return;
      }

      stopSpeech();
      const requestId = speechRequestId;
      let speechFailed = false;
      speechStatus.textContent = labels.listenStarting;
      const utterances = [
        new SpeechSynthesisUtterance(englishText),
        new SpeechSynthesisUtterance(mandarinText),
        new SpeechSynthesisUtterance(cantoneseText)
      ];
      utterances[0].lang = "en-US";
      utterances[1].lang = "zh-CN";
      utterances[2].lang = "zh-HK";
      utterances.forEach((utterance) => {
        utterance.rate = 0.85;
        utterance.onerror = () => {
          if (requestId === speechRequestId) {
            speechFailed = true;
            speechStatus.textContent = labels.speechError;
          }
        };
      });
      utterances[utterances.length - 1].onend = () => {
        if (requestId === speechRequestId && !speechFailed) {
          speechStatus.textContent = labels.listenDone;
        }
      };
      utterances.forEach((utterance) => window.speechSynthesis.speak(utterance));
    }

    function playSound(kind) {
      if (!state.soundEnabled) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      soundContext ||= new AudioContextClass();
      if (soundContext.state === "suspended") soundContext.resume();

      const notes = {
        tap: [440, 0.08],
        reveal: [660, 0.2],
        victory: [784, 0.32],
        toggle: [520, 0.1]
      };
      const [frequency, duration] = notes[kind];
      const oscillator = soundContext.createOscillator();
      const gain = soundContext.createGain();
      const now = soundContext.currentTime;
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.045, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain);
      gain.connect(soundContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration);
    }

    function speakInLanguage(text, language) {
      const labels = ui[state.language];
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        speechStatus.textContent = labels.speechUnavailable;
        return;
      }
      stopSpeech();
      const requestId = speechRequestId;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language;
      utterance.rate = 0.82;
      speechStatus.textContent = labels.listenStarting;
      utterance.onend = () => {
        if (requestId === speechRequestId) speechStatus.textContent = labels.listenDone;
      };
      utterance.onerror = () => {
        if (requestId === speechRequestId) speechStatus.textContent = labels.speechError;
      };
      window.speechSynthesis.speak(utterance);
    }

    function setupWritingCanvas() {
      const canvas = document.getElementById("writing-canvas");
      const context = canvas.getContext("2d");
      const bounds = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.round(bounds.width * scale);
      canvas.height = Math.round(bounds.height * scale);
      context.scale(scale, scale);
      context.lineWidth = 7;
      context.lineCap = "round";
      context.lineJoin = "round";
      context.strokeStyle = "#f2bf58";
      let drawing = false;

      canvas.addEventListener("pointerdown", (event) => {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        const rect = canvas.getBoundingClientRect();
        context.beginPath();
        context.moveTo(event.clientX - rect.left, event.clientY - rect.top);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        context.lineTo(event.clientX - rect.left, event.clientY - rect.top);
        context.stroke();
      });
      const stopDrawing = () => {
        drawing = false;
      };
      canvas.addEventListener("pointerup", stopDrawing);
      canvas.addEventListener("pointercancel", stopDrawing);
      canvas.addEventListener("lostpointercapture", stopDrawing);
    }

        <div class="catalog-grid">${cards}</div>
      `;

      gameMain.querySelectorAll(".level-card.available").forEach((card) => {
        card.addEventListener("click", () => {
          playSound("tap");
          state.chapterIndex = Number(card.dataset.levelIndex);
          state.questionIndex = 0;
          state.phase = "question";
          render();
        });
      });
    }

    function renderQuestion() {
      const chapter = chapters[state.chapterIndex];
      const question = chapter.questions[state.questionIndex];
      const labels = ui[state.language];
      gameMain.innerHTML = `
        ${dialogueMarkup(state.language === "zh"
          ? "看看这个问题。花点时间读一读，再选择最适合的答案。"
          : "Take a look at this question. Read it at your own pace, then choose the answer that feels right.", "Mina Park")}
        <div class="vn-question-backdrop" aria-hidden="true"></div>
        <section class="vn-question-popup vn-question-area" role="dialog" aria-modal="true" aria-labelledby="story-question-title">
          <div class="chapter-head">
            <span class="chapter-number">0${state.chapterIndex + 1}</span>
            <div class="chapter-meta"><strong>${chapter.title} · ${chapter.titleZh}</strong>${labels.question} ${state.questionIndex + 1} of 3</div>
          </div>
          <h2 class="question-title" id="story-question-title" tabindex="-1">${question.en}</h2>
          <p class="question-zh">${question.zh}</p>
          <button type="button" class="listen-btn" id="listen-question">${labels.listen}</button>
          <div class="answers">
            ${question.answers.map((answer, idx) => `
              <button class="answer-btn" type="button" data-index="${idx}" style="--entry-delay: ${idx * 85}ms">
                <strong>${answer.en}</strong>
                <span>${answer.zh}</span>
              </button>
            `).join("")}
          </div>
        </section>
      `;

      gameMain.querySelectorAll(".answer-btn").forEach((btn) => {
        btn.addEventListener("click", () => chooseAnswer(Number(btn.dataset.index)));
      });
      document.getElementById("listen-question").addEventListener("click", () => {
        const englishText = [question.en, ...question.answers.map((answer) => answer.en)].join(". ");
        const chineseText = [question.zh, ...question.answers.map((answer) => answer.zh)].join("。");
        speakBilingual(englishText, chineseText);
      });
      document.getElementById("story-question-title").focus();
    }

    function chooseAnswer(index) {
      playSound("tap");
      const chapter = chapters[state.chapterIndex];
      const answer = chapter.questions[state.questionIndex].answers[index];
      state.answers.push(answer);
      state.traits[answer.trait] += 1;
      applyHeroBonus(answer.trait);
      state.questionIndex += 1;

      if (state.questionIndex === 3) {
        playSound("reveal");
        document.body.classList.add("dramatic-shake");
        window.setTimeout(() => document.body.classList.remove("dramatic-shake"), 400);
        const trait = dominantTrait();
        state.revealed[state.chapterIndex] = chapters[state.chapterIndex].story[trait];
        state.phase = "story";
      }

      render();
    }

    function renderStory() {
      const labels = ui[state.language];
      const chapter = chapters[state.chapterIndex];
      const story = state.revealed[state.chapterIndex];
      const isLast = state.chapterIndex === chapters.length - 1;

      gameMain.innerHTML = `
        ${dialogueMarkup(state.language === "zh"
          ? "城市里的灯又亮起来了。谢谢你愿意帮助大家。"
          : "The city lights are coming back. Thank you for taking the time to help.", "Mina Park")}
        <article class="story-panel">
          <p class="story-kicker">${labels.chapter} ${state.chapterIndex + 1} · Part ${state.chapterIndex + 1} of 3</p>
          <h2 class="story-title">${story[0]}</h2>
          <p class="story-title-zh">${story[1]}</p>
          <div class="summary-box" style="margin-bottom: 18px;">${labels.support}</div>
          <button type="button" class="listen-btn" id="listen-story">${labels.listen}</button>
          <p class="story-copy">${story[2]}</p>
          <p class="story-copy-zh">${story[3]}</p>
          <button type="button" class="primary-btn" id="continue-button">${isLast ? labels.finish : labels.nextStory} →</button>
        </article>
      `;

      document.getElementById("listen-story").addEventListener("click", () => {
        speakBilingual(`${story[0]}. ${story[2]}`, `${story[1]}。${story[3]}`);
      });

      document.getElementById("continue-button").addEventListener("click", () => {
        if (isLast) {
          playSound("victory");
          state.phase = "ending";
        } else {
          playSound("tap");
          state.chapterIndex += 1;
          state.questionIndex = 0;
          state.phase = "catalog";
        }
        render();
      });
    }

    function renderEnding() {
      const labels = ui[state.language];
      const endingTrait = dominantTrait();
      const [title, copy, titleZh] = labels.endingCopy[endingTrait];
      const summary = `${labels.heroNames[state.hero]} · ${labels.stats.hope}: ${state.stats.hope} · ${labels.stats.memory}: ${state.stats.memory} · ${labels.stats.courage}: ${state.stats.courage}`;

      gameMain.innerHTML = `
        ${dialogueMarkup(state.language === "zh"
          ? "我曾以为可以控制文字。现在我明白了：每个人都应该用自己的方式学习。"
          : "I thought words could be controlled. Now I understand: everyone deserves to learn in their own way.", "Mina Park")}
        <article class="story-panel">
          <p class="story-kicker">${labels.ending}</p>
          <h2 class="story-title">${title}</h2>
          <p class="story-title-zh">${titleZh}</p>
          <div class="summary-box" style="margin-bottom: 18px;">${summary}</div>
          <p class="story-copy">${copy}</p>
          <p class="story-copy-zh">${titleZh === "The Keeper of Small Lights" ? "微光守护者" : titleZh}</p>
          <button type="button" class="primary-btn" id="again-button">${labels.again} ↻</button>
        </article>
      `;

      document.getElementById("again-button").addEventListener("click", resetGame);
    }

    function resetGame() {
      state.phase = "start";
      state.lessonIndex = 0;
      state.practiceStep = "study";
      state.practiceFeedback = "";
      state.chapterIndex = 0;
      state.questionIndex = 0;
      state.readingMode = "mandarin";
      state.readingFeedback = "";
      state.readingComplete = false;
      state.accessible = true;
      state.answers = [];
      state.traits = { kind: 0, curious: 0, brave: 0 };
      state.stats = { hope: 12, memory: 12, courage: 12 };
      state.revealed = [];
      render();
    }

    function render() {
      stopSpeech();
      renderHeaderText();
      renderScene();
      renderProgress();
      renderStats();

      if (state.phase === "learn" || state.phase === "practiceDone") return renderPractice();
      if (state.phase === "start") return renderStart();
      if (state.phase === "readingChallenge") return renderReadingChallenge();
      if (state.phase === "catalog") return renderCatalog();
      if (state.phase === "question") return renderQuestion();
      if (state.phase === "story") return renderStory();
      return renderEnding();
    }

    document.getElementById("language-toggle").addEventListener("click", () => {
      state.language = state.language === "en" ? "zh" : "en";
      render();
    });

    document.getElementById("font-toggle").addEventListener("click", () => {
      state.roundedFont = !state.roundedFont;
      renderFontToggle();
    });

    document.getElementById("practice-toggle").addEventListener("click", () => {
      state.phase = "learn";
      render();
    });

    document.getElementById("sound-toggle").addEventListener("click", () => {
      state.soundEnabled = !state.soundEnabled;
      render();
      playSound("toggle");
    });

    document.getElementById("easy-toggle").addEventListener("click", () => {
      state.accessible = !state.accessible;
      render();
    });

    document.getElementById("reset-button").addEventListener("click", () => {
      if (state.answers.length === 0 || window.confirm(state.language === "en" ? "Restart the mission from the beginning?" : "要从头重新开始任务吗？")) {
        resetGame();
      }
    });

    render();
  </script>
</body>
</html>
